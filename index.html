<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="TonUINO Studio: Hörspiele auf die SD-Karte bringen, Karten gestalten und beschreiben, Firmware aufspielen." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>TonUINO Studio</title>
    <style>
      /* Paper from the very first frame, not a white window while the app loads (TODO #70): the
         colours of --bg in src/ui/styles/tokens.css. On body and without weight (:where), so the
         app's own background replaces it as soon as its style sheet is there. */
      body {
        margin: 0;
        background: #f6f1e8;
      }
      :where(html[data-theme='dark']) body {
        background: #1d1b19;
      }
      /* The logo, until the app draws its first page. Shown at once: while the app's scripts load,
         WebKitGTK draws no frames, so a logo that faded in later would never show there. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
      }
    </style>
    <script>
      // The saved theme, set before the first paint so the app does not flash in the wrong
      // colours on start. Same rule as the effect in src/app/state.ts, which takes over once the
      // app runs. The look is always "Holzwerkstatt" (src/ui/stil.ts); a style saved by an
      // earlier version is ignored.
      document.documentElement.dataset.stil = 'holz';
      try {
        var saved = JSON.parse(localStorage.getItem('tonuino-studio:settings') || '{}') || {};
        var theme = saved.theme;
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        // Storage blocked: the app sets the theme as soon as it starts.
      }
    </script>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="112" height="112"><g stroke-linejoin="round" stroke-linecap="round">  <g fill="#fffdf8" stroke="#fffdf8" stroke-width="22"><path d="M22 104 C70 100 150 99 206 101 L210 236 C150 239 80 239 20 236 Z"/><path d="M22 104 L52 78 C110 76 180 75 232 76 L206 101 C150 99 70 100 22 104 Z"/><path d="M206 101 L232 76 L235 206 L210 236 Z"/></g><g transform="rotate(-11 128 52)"><rect x="76" y="10" width="112" height="78" rx="9" fill="#fffdf8" stroke="#fffdf8" stroke-width="22"/></g><g stroke="#1f1a16" stroke-width="8"><path d="M206 101 L232 76 L235 206 L210 236 Z" fill="#a8723f"/><path d="M22 104 L52 78 C110 76 180 75 232 76 L206 101 C150 99 70 100 22 104 Z" fill="#e3bf86"/><path d="M22 104 C70 100 150 99 206 101 L210 236 C150 239 80 239 20 236 Z" fill="#cf9a5c"/></g><path d="M32 124c14-2 26 1 40-1M174 228c8-1 16 0 26-1M150 120c14-1 26 0 36 1" fill="none" stroke="#8c6238" stroke-width="4"/><g fill="#1f1a16"><circle cx="115" cy="148" r="7.5"/><circle cx="135.7" cy="151.6" r="6.2"/><circle cx="122.2" cy="167.7" r="6.2"/><circle cx="101.5" cy="164.1" r="6.2"/><circle cx="94.3" cy="144.4" r="6.2"/><circle cx="107.8" cy="128.3" r="6.2"/><circle cx="128.5" cy="131.9" r="6.2"/></g><circle cx="72" cy="206" r="16" fill="#e5483b" stroke="#1f1a16" stroke-width="7"/><circle cx="115" cy="205" r="19" fill="#f6c12c" stroke="#1f1a16" stroke-width="7"/><circle cx="158" cy="204" r="16" fill="#3f8fd6" stroke="#1f1a16" stroke-width="7"/><path d="M66 200c3-3 7-3 10-2M108 198c3-3 8-4 12-2M152 198c3-3 7-3 10-2" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="4"/><g transform="rotate(-11 128 52)"><rect x="76" y="10" width="112" height="78" rx="9" fill="#fffdf8" stroke="#1f1a16" stroke-width="8"/><rect x="88" y="22" width="46" height="54" rx="4" fill="#9c5d98" stroke="#1f1a16" stroke-width="5"/><path d="M150 38c6 6 6 16 0 22M163 31c10 10 10 26 0 36" fill="none" stroke="#1f1a16" stroke-width="6" stroke-linecap="round"/></g></g></svg>
    </div>
    <div id="app"></div>
    <script>
      // Opened by double-click from a folder (file://): the browser refuses to load the app's
      // files there and the page would stay white. Say what to do instead.
      if (location.protocol === 'file:') {
        document.getElementById('boot').remove();
        document.getElementById('app').innerHTML =
          '<div style="max-width:34rem;margin:15vh auto;padding:0 16px;font:1.1rem/1.5 system-ui,sans-serif">' +
          '<h1 style="font-size:1.5rem">TonUINO Studio</h1>' +
          '<p>Die Web-App läuft nur auf einer Internetseite, nicht per Doppelklick aus einem Ordner.</p>' +
          '<p>Auf diesem Computer nimm die TonUINO-Studio-App für Linux oder Windows.</p></div>';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
